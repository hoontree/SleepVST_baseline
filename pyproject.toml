[project]
name = "sleepvst-baseline"
version = "0.1.0"
description = "Sleep staging via video and physiological signals"
readme = "readme.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "torch==2.0.0",
    "torchvision==0.15.1",
    "torchsummary==1.5.1",
    "numpy==1.22.1",
    "scipy==1.8.0",
    "pandas==1.4.2",
    "scikit-learn==1.0.2",
    "scikit-image==0.21.0",
    "opencv-python-headless==4.13.0.92",
    "hydra-core==1.3.3",
    "omegaconf==2.3.1",
    "mne==1.0.2",
    "tqdm==4.64.0",
    "wandb==0.15.7",
    "matplotlib==3.5.1",
    "imageio==2.35.1",
    "joblib==1.1.0",
    "pillow==10.4.0",
    "psutil==5.9.5",
    "seaborn>=0.12.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu117" }]
torchvision = [{ index = "pytorch-cu117" }]

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
