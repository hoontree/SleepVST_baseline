# @package _global_

# Test configuration
command: test

defaults:
  - /data@data.kvss: kvss
  - /data@data.shhs: shhs
  - /data@data.mesa: mesa
  - /model: SleepVST_BW
  - _self_

test:
  checkpoint: checkpoint/finetune/sleepvst_finetune_kvss_finetuned.pth
  datasets:
    - kvss
    # - shhs
    # - mesa

# run() reads cfg.system.device/gpu_ids before dispatching, so this block is required.
system:
  device: cuda
  num_workers: 8
  pin_memory: true
  gpu_ids: "4"

log:
  dir: logs/test
  name: test
