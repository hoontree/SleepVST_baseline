# @package _global_

# Pretrain configuration for SHHS + MESA
command: pretrain

defaults:
  - /data@data.shhs: shhs
  - /data@data.mesa: mesa
  - /model: SleepVST
  - /train: defaults
  - _self_

train:
  log_name: sleepvst_pretrain
  checkpoint_dir: checkpoint/pretrain
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  epochs: 50
  from_scratch: true
  early_stopping_patience: 10

# run() reads cfg.system.device/gpu_ids before dispatching, so this block is required.
system:
  device: cuda
  num_workers: 8
  pin_memory: true
  gpu_ids: "4"

log:
  dir: logs/pretrain
  name: pretrain

wandb:
  project: SleepVST
  entity: null  # Set your wandb entity here
