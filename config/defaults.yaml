defaults:
  # transfer_to_video needs a dataset in mode=transfer whose `model` matches
  # `model:` below (SleepVST dual). kvss.yaml is mode=finetune / SleepVST_BW,
  # which makes transfer load empty regular samples -- kvss_bwproxy_v2 is the
  # matching config (mode=transfer, SleepVST, video BW proxy).
  - data: kvss_bwproxy_v2
  - model: SleepVST
  - mode: transfer
  - log: log_transfer
  - preprocess: respiratory
  - train: defaults
  - _self_

system:
  device: cuda
  num_workers: 8
  pin_memory: true
  gpu_ids: "4"

command: transfer_to_video
d_model: 128
motion_dim: 90 
seq_len: 240
step_size: 60

transfer:
  modality: bw
  classifier:
    mode: fit_test
    name: rf